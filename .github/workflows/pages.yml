name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          VITE_AUTH_ENABLED: "false"
        run: node scripts/with-app-env.mjs vite build
      - name: Prepare Pages folder
        run: |
          set -e
          if [ -d .output/public ]; then
            OUT=.output/public
          elif [ -d dist/client ]; then
            OUT=dist/client
          elif [ -d dist ]; then
            OUT=dist
          else
            echo "No build output found" && ls -la && exit 1
          fi
          mkdir -p _site
          cp -R "$OUT"/. _site/
          if [ -f _site/index.html ] && [ ! -f _site/404.html ]; then
            cp _site/index.html _site/404.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
