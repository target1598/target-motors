name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          VITE_AUTH_ENABLED: "false"
        run: node scripts/with-app-env.mjs ./node_modules/.bin/vite build
      - name: Prepare Pages folder
        run: |
          set -e
          echo "Build output:"
          find dist .output -name '*.html' 2>/dev/null || true
          if [ -d .output/public ] && [ -f .output/public/index.html ]; then
            OUT=.output/public
          elif [ -d dist/client ]; then
            OUT=dist/client
          elif [ -d dist ]; then
            OUT=dist
          else
            echo "No build output found" && ls -la && exit 1
          fi
          echo "Using $OUT"
          mkdir -p _site
          cp -R "$OUT"/. _site/
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then
            if [ -f _site/_shell.html ]; then
              cp _site/_shell.html _site/index.html
            elif [ -f dist/client/_shell.html ]; then
              cp dist/client/_shell.html _site/index.html
            else
              echo "No index.html or _shell.html to publish"
              ls -la _site
              exit 1
            fi
          fi
          cp _site/index.html _site/404.html
          ls -la _site | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
