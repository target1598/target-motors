      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          VITE_AUTH_ENABLED: "false"
        run: node scripts/with-app-env.mjs ./node_modules/.bin/vite build || true
      - name: Prepare Pages folder
        run: |
          set -e
          if [ -d .output/public ]; then
            OUT=.output/public
          elif [ -d dist/client ]; then
            OUT=dist/client
          elif [ -d dist ]; then
            OUT=dist
          else
            echo "No build output found" && ls -la && exit 1
          fi
          mkdir -p _site
          cp -R "$OUT"/. _site/
          if [ -f _site/index.html ] && [ ! -f _site/404.html ]; then
            cp _site/index.html _site/404.html
          fi
          ls -la _site | head